<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 일기로 레벨업</title>
</head>

<body>
  <!-- 구조 생성 -->
  <aside id="sideScreen">
    <!-- 프로필 영역 -->
    <div id="profile">
      <!-- 유저 정보 영역 -->
      <div id="userInformation">
        <!-- 프로필 사진 -->
        <div id="profilePicture"></div>
        <!-- 닉네임 -->
        <p id="nickname"></p>
      </div>
      <!-- 유저 레벨 영역 -->
      <div id="userLevel">
        <!-- 레벨 -->
        <p id="level">
      </div>
      <!-- 경험치바 -->
      <div id="expBar">
        <!-- 현재 경험치바 -->
        <div id="nowExpBar"></div>
      </div>
      <!-- 전체 경험치수치 -->
      <p id="allExp"></p>
      <!-- 경험치 구분 -->
      <span id="expDivise">/</span>
      <!-- 누적 경험치수치 -->
      <p id="accumulateExp"></p>
    </div>
    <!-- 일기 작성, 검색, 리스트 모음 -->
    <div id="diaryUtil">
      <!-- 일기작성버튼 -->
      <button id="writeDiary">일기 작성하기!</button>
      <!-- 검색창 영역 -->
      <div id="search">
        <!-- 검색창 입력 영역 -->
        <div id="searchBox">
          <input type="text" id="searchInput">
          <button id="searchButton">검색</button>
        </div>
      </div>
      <!-- 일기 리스트 -->
      <ul id="diaryList">
        <!-- 추후 자바스크립트에 의한 li 태그 추가로 -->
        <!-- ul에 일기 목록들 채워볼 예정 -->
      </ul>
    </div>
  </aside>
  <!-- 메인 화면 -->
  <div id="mainScreen">
    <!-- 헤더(제목) -->
    <header id="mainHeader"></header>
    <!-- 메인화면 내용 -->
    <main id="mainContext">
    </main>
  </div>
</body>

</html>
