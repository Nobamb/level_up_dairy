<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 일기로 레벨업</title>
</head>

<body>
  <!-- 구조 생성 -->
  <aside id="sideScreen">
    <!-- 프로필 영역 -->
    <div id="profile">
      <!-- 유저 정보 영역 -->
      <div id="userInformation">
        <!-- 프로필 사진 -->
        <div id="profilePicture"></div>
        <!-- 닉네임 -->
        <p id="nickname"></p>
      </div>
      <!-- 유저 레벨 영역 -->
      <div id="userLevel">
        <!-- 레벨 -->
        <p id="level">
      </div>
      <!-- 경험치바 -->
      <div id="expBar">
        <!-- 현재 경험치바 -->
        <div id="nowExpBar"></div>
      </div>
      <!-- 전체 경험치수치 -->
      <p id="allExp"></p>
      <!-- 경험치 구분 -->
      <span id="expDivise">/</span>
      <!-- 누적 경험치수치 -->
      <p id="accumulateExp"></p>
    </div>
  </aside>
  <!-- 메인 화면 -->
  <div id="mainScreen">
    <!-- 헤더(제목) -->
    <header id="mainHeader"></header>
    <!-- 메인화면 내용 -->
    <main id="mainContext">
    </main>
  </div>
</body>

</html>
