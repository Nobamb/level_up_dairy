<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 일기로 레벨업</title>
    <!-- css 가져오기 -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- 구조 생성 -->
    <!-- 전체구조-->
    <div id="fullStructure">
      <!-- 왼쪽 사이드 영역 -->
      <aside id="sideScreen">
        <!-- 프로필 영역 -->
        <div id="profile">
          <!-- 유저 정보 영역 -->
          <div id="userInformation">
            <!-- 프로필 사진 -->
            <div id="profilePicture"></div>
            <!-- 닉네임 -->
            <p id="nickname"></p>
          </div>
          <!-- 유저 레벨 영역 -->
          <div id="userLevel">
            <!-- 레벨 -->
            <p id="level"></p>
          </div>

          <!-- 경험치바 -->
          <div id="expBar">
            <!-- 현재 경험치바 -->
            <div id="nowExpBar"></div>
          </div>
          <!-- 전체 경험치수치 -->
          <p id="allExp"></p>
          <!-- 경험치 구분 -->
          <span id="expDivise">/</span>
          <!-- 누적 경험치수치 -->
          <p id="accumulateExp"></p>
        </div>
        <!-- 일기 작성, 검색, 리스트 모음 -->
        <div id="diaryUtil">
          <!-- 일기작성버튼 -->
          <form action="">
            <button id="writeDiaryButton">일기 작성하기!</button>
          </form>

          <!-- 검색창 영역 -->
          <div id="search">
            <!-- 검색창 입력 영역 -->
            <form id="searchBox">
              <input type="text" id="searchInput" />
              <button id="searchButton">검색</button>
            </form>
          </div>
          <!-- 일기 리스트 -->
          <ul id="diaryList">
            <!-- 추후 자바스크립트에 의한 li 태그 추가로 -->
            <!-- ul에 일기 목록들 채워볼 예정 -->
          </ul>
        </div>
      </aside>
      <!-- 메인 화면 -->
      <div id="mainScreen">
        <!-- 메인화면 하위 내용들 off 추가 -->
        <!-- 다른 일기를 띄우지 않는 이상 화면상에 보여지지 않기 위함 -->
        <!-- 다른 일기들을 띄우게 될 시 곧바로 on -->
        <!-- 화면에 띄우던 일기들을 보여주지 않을 시 다시 off -->
        <!-- 헤더(제목) -->
        <header id="mainHeader" class="off">
          <!-- 수정 중일 땐 input이 on/ h1이 off -->
          <!-- 일기 작성 완료하면 h1이 on/ input이 off -->
          <!-- on/off 상태에 따라 제목이 나오거나 나오지 않음 -->
          <!-- on상태일 때 등장 -->
          <!-- off상태일 땐 미등장 -->
          <form action="">
            <input type="text" id="inputTitle" class="off" value="제목" />
          </form>
          <h1 id="title" class="on">제목</h1>
          <!-- 날짜 -->
          <p id="nowDate"></p>
          <!-- button 3형제 -->
          <!-- 수정, 삭제, 저장 -->
          <!-- 작성이 완료된 글은 수정, 삭제만 -->
          <!-- 작성중인 글은 저장만 -->
          <form id="settingButtons">
            <button id="saveButton" class="on">저장</button>
            <button id="updateButton" class="off">수정</button>
            <button id="deleteButton" class="off">삭제</button>
          </form>
        </header>
        <!-- 메인화면 내용 -->
        <main id="mainContext" class="off">
          <!-- 수정 중일 땐 input이 on/ p가 off -->
          <!-- 일기 작성 완료하면 p가 on/ input이 off -->
          <!-- on/off 상태에 따라 내용이 나오거나 나오지 않음 -->
          <!-- on상태일 때 등장 -->
          <!-- off상태일 땐 미등장 -->
          <form action="">
            <input type="text" id="inputContext" class="off" value="내용" />
          </form>
          <p id="diaryContext" class="on">내용</p>
        </main>
      </div>
    </div>
  </body>
  <!-- 자바스크립트 가져오기 -->
  <script src="main.js" type="module"></script>
</html>
